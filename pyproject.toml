[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codemender-fleet-monitor"
version = "0.1.0"
description = "Continuous Multi-Repository Security Monitoring Control Plane & Workers for CodeMender (cm v0.12+)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kui Luo", email = "kuiluo@google.com" }
]
dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
